# Publishes io.genderapi:genderapi to GitHub Packages when a v* tag is pushed
# (for example v2.0.0). The tag must match the <version> in pom.xml.
# See https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github # matches distributionManagement/repository/id in pom.xml
          settings-path: ${{ github.workspace }} # location for the generated settings.xml

      - name: Check tag matches project version
        run: |
          VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom.xml version ${VERSION}" >&2
            exit 1
          fi

      - name: Test and package
        run: mvn -B verify

      - name: Publish to GitHub Packages
        run: mvn -B deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
